# specwatch — upstream artefact sources, pinned.
# `pull.py` fetches these into vendor/ (gitignored), records hashes in
# lock.json, and diffs between pins. Bump pins deliberately, per release
# cycle; the diff report is the release-notes input.

# The spec cycle these pins actually implement (YYYY.MM). This is the SINGLE
# SOURCE OF TRUTH for a release tag's calendar component: publish.yml refuses to
# build a tag whose YYYY.MM != this value, so a tag can never misstate which
# Peppol release the image validates against. Bump it in the SAME commit that
# bumps the pins (a step of the pre-tag release drill).
cycle: "2026.05"

sources:
  peppol-bis-billing:
    repo: OpenPEPPOL/peppol-bis-invoice-3
    # BIS 3.0.21, 2026 May release (published 2026-05-20, mandatory 2026-08-17).
    # PINNED TO A COMMIT, NOT A TAG: OpenPeppol published 3.0.21 on docs.peppol.eu
    # without tagging GitHub (the last tag is still v3.0.20). The 2026-Q2-QA2 branch
    # head ("Updated mandatory date", 2026-06-10) carries PEPPOL-EN16931-UBL.sch and
    # CEN-EN16931-UBL.sch byte-identical to the live
    # docs.peppol.eu/poacc/billing/3.0/files/ copies (cmp'd 2026-10-09); the
    # 2026-Q2-MR and 2026-Q2-validation-artefacts branches do NOT match. Lesson:
    # the release-notes page + the live .sch header are authoritative; the tags
    # API is not (the 2026-07 drill missed this release for exactly that reason).
    # Previous pin: v3.0.20 (2025 November, incl. the 2026-01-27 hotfix).
    ref: 806866bd2bd91d7e9623b68f08164e8fbe9e67a0
    paths:
      - rules/sch/PEPPOL-EN16931-UBL.sch
      - rules/sch/CEN-EN16931-UBL.sch
      - rules/examples
  en16931-artefacts:
    repo: ConnectingEurope/eInvoicing-EN16931
    ref: validation-1.3.16 # EN 16931 validation artefacts v1.3.16 (2026-04-13)
    paths:
      - ubl/schematron
      - cii/schematron
  iso-schematron-skeleton:
    repo: Schematron/schematron
    ref: "2020-10-01"      # official ISO Schematron 'skeleton' compiler XSLTs
    paths:
      - trunk/schematron/code
  xrechnung-schematron:
    host: projekte.kosit.org  # GitLab archive endpoint, not GitHub codeload
    repo: xrechnung/xrechnung-schematron
    ref: v2.6.0               # 2026-09-01 release, XRechnung 3.0.x, "Using Peppol BIS Billing 3.0.21"
                              # (previous: v2.5.0, 2026-02-04)
    paths:
      # whole tree: the entry .sch files include common.sch relatively
      - src/validation/schematron
  pint-aunz-billing:
    # PINT A-NZ Billing v1.1.3 (page says "21 May 2026"; the 2026-09-07 hash bump
    # below IS this version — the page's version line was updated after the zip)
    # — previously v1.1.2 (released 2025-11-21) — the mandatory Peppol
    # specification for Australia & New Zealand since 15 May 2025. The older
    # A-NZ PEPPOL BIS 3.0 extension left the network 2026-03-31; its GitHub
    # repo (A-NZ-PEPPOL/A-NZ-PEPPOL-BIS-3.0) is now an empty README pointing
    # here. So our peppol-bis-3 profile does NOT cover A-NZ.
    #
    # THE ONLY SOURCE NOT PINNED TO A RELEASE TAG. OpenPeppol publishes this as
    # a single UNVERSIONED zip on the docs site — "1.1.2" is prose on the page,
    # not a ref, and the URL does not change when the content does. So the pin
    # is the zip's sha256 and pull.py HARD-FAILS on mismatch. A mismatch means
    # upstream republished: review the artefact diff, then bump `sha256` in the
    # same commit as any rule fallout — the same ceremony as bumping a tag.
    # This DETECTS drift; it cannot reproduce a superseded zip. If OpenPeppol
    # ever publishes a versioned URL, switch to it and drop the hash.
    #
    # Both .sch are self-contained (no include/href/.gc refs), so unlike the
    # KoSIT source we do not need to vendor a whole tree. The .gc code lists
    # are unused (rules are preprocessed) and common/docs is three PDFs;
    # example/ is vendored for the same reason as peppol-bis-billing's.
    #
    # PIN HISTORY (this is why the hash is here — it has already earned its keep):
    #   5750a93f… -> 277206b6…  bumped 2026-09-07. Upstream republished silently:
    #     same URL, same 27 files, no version bump on the page, and it happened
    #     WITHIN A SINGLE DAY (a pull.py run that morning matched the old hash).
    #     Reviewed diff: only PINT-UBL-validation-preprocessed .sch/.xslt changed
    #     (invoice + creditnote are identical copies). Substantive, not a repack —
    #     ANG and BGN dropped from the ibr-cl-03/04/05 currency lists and XCG
    #     added (both genuine ISO 4217 retirements: BGN on Bulgaria's euro entry,
    #     ANG superseded by XCG); ibr-126 loosened to exempt
    #     ancestor::cac:ItemPriceExtension from the currency-match rule; ibr-sr-45
    #     (due date max once) removed. Corpus impact: none — validate.py --all
    #     stayed 0 fatal / 0 warning and no fixture uses ANG or BGN.
    url: https://docs.peppol.eu/poac/aunz/pint-aunz/resources.zip
    sha256: 277206b650f22689b6f71de38e7e92619de315625910efb3fd89a4d1e039ea5d
    paths:
      - trn-invoice/schematron
      - trn-creditnote/schematron
      - trn-invoice/example
      - trn-creditnote/example
notes:
  ubl-xsd: >
    OASIS UBL 2.1 maindoc + common XSDs are vendored once (stable since 2013):
    docs.oasis-open.org/ubl/os-UBL-2.1/xsd/
