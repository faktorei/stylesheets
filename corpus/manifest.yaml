    # 500-line / 24-page document renders in roughly 2.5s at roughly 62 MB heap —
    # the evidence behind FAKTOREI_MAX_LINES (see Limits.java): the 10k default is a
    # deliberately generous multiple of a comfortably-bounded working set.
